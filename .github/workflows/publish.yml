name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Trusted publishing: npm trusts this workflow in this repository over
      # OIDC, so there is no token stored, rotated or leaked, and the tarball
      # gets a provenance attestation. The publisher is configured on npm's
      # side: https://docs.npmjs.com/trusted-publishers
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: script/bootstrap

      - name: Publish to npm
        run: npm publish

      # The GitHub Release is script/publish's job, not this workflow's: it has
      # the changelog entry script/changelog just cut, and posting it from here
      # would race the release the maintainer already created.
