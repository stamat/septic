name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Trusted publishing: npm trusts *this workflow in this repository* over
      # OIDC, so there is no token to store, rotate or leak, and the artifact
      # gets a provenance attestation. Configure the publisher on npm first:
      # https://docs.npmjs.com/trusted-publishers
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish
